# DucoBox Silent ventilation via an ESPEasy RF gateway (Ducobox plugin P150).
#
# The gateway joins the DucoBox as an RF CO2 sensor and talks MQTT to Home
# Assistant using the "Home Assistant (openHAB) MQTT" controller. Topics below
# assume the ESPEasy settings from ducobox/README.md:
#   unit name `ducobox`, task name `duco`, value `Ventilationmode`.
#
# Ventilationmode values reported by the plugin:
#   0 auto, 1 low, 2 middle, 3 high, 4 not home,
#   11 permanent low, 12 permanent middle, 13 permanent high
#
# VENTMODE,<mode>,<override %>,<button presses> is the gateway command.
# Timed modes (LOW/MIDDLE/HIGH) run for 15 min per button press, 1 to 3
# presses, then the DucoBox falls back to auto.

mqtt:
  select:
    - name: Ventilation mode
      unique_id: ducobox_ventilation_mode
      icon: mdi:fan
      state_topic: ducobox/duco/Ventilationmode
      value_template: >-
        {{ {0: 'Auto', 1: 'Low', 2: 'Middle', 3: 'High', 4: 'Not home',
            11: 'Permanent low', 12: 'Permanent middle', 13: 'Permanent high'}
           .get(value | float(-1) | int, 'Auto') }}
      command_topic: ducobox/cmd
      command_template: >-
        VENTMODE,{{ {'Auto': 'AUTO', 'Low': 'LOW', 'Middle': 'MIDDLE', 'High': 'HIGH',
                     'Not home': 'NOTHOME', 'Permanent low': 'PERMANENTLOW',
                     'Permanent middle': 'PERMANENTMIDDLE',
                     'Permanent high': 'PERMANENTHIGH'}[value] }},0,1
      options:
        - Auto
        - Low
        - Middle
        - High
        - Not home
        - Permanent low
        - Permanent middle
        - Permanent high
      availability_topic: ducobox/LWT
      payload_available: Connected
      payload_not_available: Connection Lost
      device: &ducobox_device
        identifiers: ducobox_silent
        name: DucoBox
        manufacturer: Duco
        model: DucoBox Silent 4215
        via_device: ducobox_gateway

  button:
    - name: Boost 15 min
      unique_id: ducobox_boost_15
      icon: mdi:fan-plus
      command_topic: ducobox/cmd
      payload_press: VENTMODE,HIGH,0,1
      availability_topic: ducobox/LWT
      payload_available: Connected
      payload_not_available: Connection Lost
      device: *ducobox_device

    - name: Boost 30 min
      unique_id: ducobox_boost_30
      icon: mdi:fan-plus
      command_topic: ducobox/cmd
      payload_press: VENTMODE,HIGH,0,2
      availability_topic: ducobox/LWT
      payload_available: Connected
      payload_not_available: Connection Lost
      device: *ducobox_device

    - name: Boost 45 min
      unique_id: ducobox_boost_45
      icon: mdi:fan-plus
      command_topic: ducobox/cmd
      payload_press: VENTMODE,HIGH,0,3
      availability_topic: ducobox/LWT
      payload_available: Connected
      payload_not_available: Connection Lost
      device: *ducobox_device

    - name: Auto
      unique_id: ducobox_auto
      icon: mdi:fan-auto
      command_topic: ducobox/cmd
      payload_press: VENTMODE,AUTO,0,1
      availability_topic: ducobox/LWT
      payload_available: Connected
      payload_not_available: Connection Lost
      device: *ducobox_device

  binary_sensor:
    - name: Connection
      unique_id: ducobox_gateway_connected
      device_class: connectivity
      entity_category: diagnostic
      state_topic: ducobox/LWT
      payload_on: Connected
      payload_off: Connection Lost
      device:
        identifiers: ducobox_gateway
        name: DucoBox RF gateway
        manufacturer: ESPEasy
        model: Wemos D1 Mini + CC1101 868 MHz
