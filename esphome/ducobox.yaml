# DucoBox Silent 4215 over RF
#
# Board: Wemos D1 Mini (ESP8266) with a CC1101 868 MHz module. The gateway
# joins the DucoBox as a wireless CO2 sensor (UCCO2), reports the current
# ventilation mode and can change it. Setup steps are in ducobox.md.
#
# Duco protocol component from https://github.com/Henkeh/DucoBox-ESPHome,
# a port of arnemauer's Ducobox ESPEasy plugin, pinned to a known commit.
#
# Wiring (CC1101 -> D1 Mini):
#   VCC -> 3V3, GND -> G, SCK -> D5, MISO -> D6, MOSI -> D7, CSN -> D8,
#   GDO0 -> D1. GDO2 is not used.

substitutions:
  name: ducobox
  friendly_name: DucoBox
  spi_clk_pin: GPIO14   # D5
  spi_miso_pin: GPIO12  # D6
  spi_mosi_pin: GPIO13  # D7
  cc1101_cs_pin: GPIO15  # D8
  # Upstream's ESP8266 example uses GPIO2 (D4), a boot strapping pin that
  # GDO0 can pull while the CC1101 powers up. D1 is free and safe.
  cc1101_gdo0_pin: GPIO5  # D1

external_components:
  - source: github://Henkeh/DucoBox-ESPHome@115228bbbc0210d7131f86c9544f84004ec157bf
    components: [duco_rf]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -10
      then:
        # Start in sync with the box: request auto after boot. This also ends
        # a running boost if the gateway reboots.
        - delay: 2s
        - lambda: id(duco_rf_gw).request_ventilation_mode(0, false, 0);

esp8266:
  board: d1_mini

logger:
  level: INFO

api:
  encryption:
    key: !secret ducobox__api_key

ota:
  - platform: esphome
    password: !secret ducobox__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret ducobox__fallback_ap_password

captive_portal:

spi:
  id: duco_spi
  clk_pin: ${spi_clk_pin}
  miso_pin: ${spi_miso_pin}
  mosi_pin: ${spi_mosi_pin}

# Radio settings for the Duco RF network, from the upstream examples.
cc1101:
  id: duco_cc1101
  spi_id: duco_spi
  cs_pin: ${cc1101_cs_pin}
  gdo0_pin: ${cc1101_gdo0_pin}
  packet_mode: true
  packet_length: 0
  crc_enable: true
  whitening: false
  modulation_type: GFSK
  frequency: 868.326447MHz
  sync_mode: 30/32
  if_frequency: 152344Hz
  channel: 0
  symbol_rate: 38383
  filter_bandwidth: 101562Hz
  channel_spacing: 199951Hz
  fsk_deviation: 20630Hz
  sync1: 0xD3
  sync0: 0x91
  num_preamble: 4

# Network ID and device address are stored in flash after pairing.
duco_rf:
  id: duco_rf_gw
  cc1101_id: duco_cc1101
  vent_mode_text_sensor: ventilation_mode_rf
  network_id_text_sensor: network_id
  device_address_text_sensor: device_address

globals:
  - id: fan_sync_in_progress
    type: bool
    initial_value: "false"

script:
  # Preset name -> Duco mode request. Low/Medium/High are timed (15 min,
  # like one press on a wall switch); Permanent ones stay until changed.
  - id: request_preset
    parameters:
      preset: std::string
    then:
      - lambda: |-
          if (preset == "Auto") id(duco_rf_gw).request_ventilation_mode(0, false, 0);
          else if (preset == "Low") id(duco_rf_gw).request_ventilation_mode(4, false, 0);
          else if (preset == "Medium") id(duco_rf_gw).request_ventilation_mode(5, false, 0);
          else if (preset == "High") id(duco_rf_gw).request_ventilation_mode(6, false, 0);
          else if (preset == "Away") id(duco_rf_gw).request_ventilation_mode(7, false, 0);
          else if (preset == "Permanent Low") id(duco_rf_gw).request_ventilation_mode(4, true, 0);
          else if (preset == "Permanent Medium") id(duco_rf_gw).request_ventilation_mode(5, true, 0);
          else if (preset == "Permanent High") id(duco_rf_gw).request_ventilation_mode(6, true, 0);
          else ESP_LOGW("ducobox", "Unknown preset %s", preset.c_str());

text_sensor:
  - platform: template
    id: ventilation_mode_rf
    name: Ventilation mode code
    icon: mdi:fan
    entity_category: diagnostic
    # Mirror the box's reported mode onto the fan without sending it back.
    on_value:
      - lambda: |-
          std::string target;
          if (x == "AUTO" || x == "AUT0" || x == "AUT1" || x == "AUT2" || x == "AUT3") target = "Auto";
          else if (x == "MAN1") target = "Low";
          else if (x == "MAN2") target = "Medium";
          else if (x == "MAN3") target = "High";
          else if (x == "EMPT") target = "Away";
          else if (x == "CNT1") target = "Permanent Low";
          else if (x == "CNT2") target = "Permanent Medium";
          else if (x == "CNT3") target = "Permanent High";
          else return;

          auto *fan = id(ventilation);
          if (fan->state && fan->get_preset_mode() == target) return;

          id(fan_sync_in_progress) = true;
          auto call = fan->make_call();
          call.set_state(true);
          call.set_preset_mode(target);
          call.perform();
          id(fan_sync_in_progress) = false;

  - platform: template
    id: network_id
    name: Network ID
    icon: mdi:identifier
    entity_category: diagnostic

  - platform: template
    id: device_address
    name: Device address
    icon: mdi:numeric
    entity_category: diagnostic

fan:
  - platform: template
    id: ventilation
    name: Ventilation
    icon: mdi:fan
    preset_modes:
      - Auto
      - Low
      - Medium
      - High
      - Away
      - Permanent Low
      - Permanent Medium
      - Permanent High
    # The box has no real "off": turning the fan off means away mode,
    # turning it on goes back to the selected preset (auto if none).
    on_turn_on:
      - if:
          condition:
            lambda: return !id(fan_sync_in_progress);
          then:
            - script.execute:
                id: request_preset
                preset: !lambda |-
                  std::string p = id(ventilation).get_preset_mode();
                  return p.empty() ? std::string("Auto") : p;
    on_turn_off:
      - if:
          condition:
            lambda: return !id(fan_sync_in_progress);
          then:
            - script.execute:
                id: request_preset
                preset: Away
    on_preset_set:
      - if:
          condition:
            lambda: return !id(fan_sync_in_progress) && !id(ventilation).get_preset_mode().empty();
          then:
            - script.execute:
                id: request_preset
                preset: !lambda return std::string(id(ventilation).get_preset_mode());

button:
  - platform: template
    name: Boost
    icon: mdi:fan-plus
    on_press:
      - script.execute:
          id: request_preset
          preset: High

  - platform: template
    name: Auto
    icon: mdi:fan-auto
    on_press:
      - script.execute:
          id: request_preset
          preset: Auto

  - platform: template
    name: Pair
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - lambda: id(duco_rf_gw).pair();

  - platform: template
    name: Unpair
    icon: mdi:link-variant-off
    entity_category: config
    on_press:
      - lambda: id(duco_rf_gw).unpair();

  - platform: template
    name: Enable installer mode
    icon: mdi:wrench
    entity_category: config
    on_press:
      - lambda: id(duco_rf_gw).enable_installer_mode();

  - platform: template
    name: Disable installer mode
    icon: mdi:wrench-check
    entity_category: config
    on_press:
      - lambda: id(duco_rf_gw).disable_installer_mode();

  - platform: restart
    name: Restart
    entity_category: config
