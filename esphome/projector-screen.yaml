# Top-Vision motorised projector screen over 433 MHz
#
# Board: Olimex ESP32-DevKit-LiPo with a CC1101 433 MHz module.
# The ESP32 replays the screen remote's codes; the screen's own receiver and
# wall controller keep handling the end limits, so the cover here is
# time based and only tracks the position it expects.
#
# CC1101 wiring (module pin -> ESP32):
#   VCC  -> 3.3V        GND  -> GND
#   SCK  -> GPIO18      MOSI -> GPIO23
#   MISO -> GPIO19      CSN  -> GPIO25
#   GDO0 -> GPIO26 (TX data in)
#   GDO2 -> GPIO27 (RX data out)
#
# Codes: captured from the original remote with the receiver below; see
# README.md to capture them again for a different remote.

substitutions:
  name: projector-screen
  friendly_name: Projector Screen
  gdo0_pin: GPIO26
  gdo2_pin: GPIO27
  # Remote codes: same 20-bit remote ID, last 4 bits are the button.
  code_up: "101110000110111000110001"
  code_down: "101110000110111000110100"
  code_stop: "101110000110111000110010"
  # Measured from a raw dump of the remote: about 330 us per pulse, with
  # protocol 1's shape (one = 3 on 1 off, zero = 1 on 3 off, sync 1 on 31 off).
  pulse_length: "330"
  # Measure with a stopwatch from fully up to fully down and back.
  down_duration: 30s
  up_duration: 30s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-devkitlipo
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret projector-screen__api_key

ota:
  - platform: esphome
    # Uploads use the api encryption key above.
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret projector-screen__fallback_ap_password

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: radio
  cs_pin: GPIO25
  # No gdo0_pin here: GDO0 belongs to remote_transmitter alone, as in
  # ESPHome's own CC1101 example. Given to cc1101 too, begin_tx turns it into
  # a plain GPIO output and cuts the transmitter off the pin.
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10

remote_transmitter:
  pin: ${gdo0_pin}
  carrier_duty_percent: 100%
  non_blocking: false
  on_transmit:
    then:
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.begin_rx: radio

remote_receiver:
  pin: ${gdo2_pin}
  # Logs every recognised code; this is how the remote gets captured.
  # Nothing showing up? Add `raw` here (it is noisy) to see the bare timings.
  dump:
    - dooya
    - rc_switch
    - nexa
    - brennenstuhl
    - keeloq
  tolerance: 50%
  filter: 250us
  idle: 4ms
  buffer_size: 2kb

script:
  # Codes captured from the original remote (EV1527 style, RCSwitch
  # protocol 1 shape at the remote's own pulse length): a 20-bit remote ID
  # followed by a 4-bit button. Each press repeats the code so the
  # controller catches it, like the remote does.
  - id: send_down
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: ${code_down}
          protocol:
            pulse_length: ${pulse_length}
          repeat: 10

  - id: send_up
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: ${code_up}
          protocol:
            pulse_length: ${pulse_length}
          repeat: 10

  - id: send_stop
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: ${code_stop}
          protocol:
            pulse_length: ${pulse_length}
          repeat: 10

cover:
  - platform: time_based
    id: screen
    name: None
    device_class: shade
    assumed_state: true
    # The motor has no limit switches, but the wall controller (an "electric
    # limiter") stores the end limits and stops the motor there. Commands go
    # through that controller, so no stop is sent at the ends, and down/up can
    # be pressed again to resync if the position drifts. README.md has a test.
    has_built_in_endstop: true
    # Cover "closed" is the screen fully down in front of the wall.
    close_action:
      - script.execute: send_down
    close_duration: ${down_duration}
    open_action:
      - script.execute: send_up
    open_duration: ${up_duration}
    stop_action:
      - script.execute: send_stop
