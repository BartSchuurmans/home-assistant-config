blueprint:
  name: TRV external temperature (zigbee2mqtt integration)
  description: |
    Sends every report of a Zigbee2MQTT temperature sensor to a thermostatic radiator valve
    (e.g. Sonoff TRVZB / TRV-ZBT) as its external temperature.
    - Set the valve's temperature sensor to "external" once in Zigbee2MQTT.
    - Triggers on the sensor's MQTT messages, so it also fires when the temperature hasn't changed.
      (It listens on all Zigbee2MQTT device topics and keeps only the picked sensor's; the device's
      name in Home Assistant's MQTT integration must still match its Zigbee2MQTT friendly name.)
    - If the sensor goes quiet (dead battery), nothing is sent and the valve falls back to its
      internal sensor by itself (Sonoff: after 2 hours without an external reading).
    - The sensor must report at least once per fallback period while the temperature holds steady;
      shorten its maximum report interval in Zigbee2MQTT if it doesn't.
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/trv-external-temperature-zigbee2mqtt.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    sensor_device:
      name: Temperature sensor
      description: "The temperature sensor paired with Zigbee2MQTT"
      selector:
        device:
          filter:
            - integration: mqtt
    base_topic:
      name: Zigbee2MQTT base topic
      default: zigbee2mqtt
      selector:
        text:
    external_temperature:
      name: Valve external temperature input
      description: "The valve's external temperature number entity (…_external_temperature_input)"
      selector:
        entity:
          filter:
            - integration: mqtt
              domain: number

mode: queued
max: 3

trigger_variables:
  base_topic: !input base_topic

triggers:
  - trigger: mqtt
    topic: "{{ base_topic }}/+"

variables:
  sensor_device: !input sensor_device

conditions:
  - condition: template
    value_template: >
      {{ trigger.topic == base_topic ~ '/' ~ device_attr(sensor_device, 'name')
         and trigger.payload_json is defined and trigger.payload_json.temperature is number }}

actions:
  - action: number.set_value
    target:
      entity_id: !input external_temperature
    data:
      value: "{{ trigger.payload_json.temperature | round(1) }}"
