blueprint:
  name: Philips Hue Dimmer Switch (hue integration)
  description: |
    Philips Hue Dimmer Switch:
    - 3 buttons (short press on/up/down), each setting an optional scene and running optional actions
    - brightness control (hold up/down)
    - off button (short press off), turning off the target lights and running optional actions
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-dimmer-switch.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    dimmer_device:
      name: Dimmer Switch Device
      description: "The Hue Dimmer Switch to configure"
      selector:
        device:
          filter:
            - integration: hue
    target_light:
      name: Target Lights
      description: "Target lights used for the off button and brightness control"
      selector:
        target:
          entity:
            - domain: light
    on_button:
      name: On button
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        scene_on:
          name: Scene
          description: "Scene to set when pushing the On button. Leave empty to set no scene."
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        on_action:
          name: Actions
          description: "Actions to run when pushing the On button, after the scene (if any)."
          default: []
          selector:
            action: {}
    up_button:
      name: Up button
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        scene_up:
          name: Scene
          description: "Scene to set when pushing the Up button. Leave empty to set no scene."
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        up_action:
          name: Actions
          description: "Actions to run when pushing the Up button, after the scene (if any)."
          default: []
          selector:
            action: {}
    down_button:
      name: Down button
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        scene_down:
          name: Scene
          description: "Scene to set when pushing the Down button. Leave empty to set no scene."
          default: ""
          selector:
            entity:
              filter:
                - domain: scene
        down_action:
          name: Actions
          description: "Actions to run when pushing the Down button, after the scene (if any)."
          default: []
          selector:
            action: {}
    off_button:
      name: Off button
      icon: mdi:power
      collapsed: true
      input:
        off_action:
          name: Actions
          description: "Actions to run when pushing the Off button, after turning off the target lights."
          default: []
          selector:
            action: {}
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per tick (~ second)"
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: parallel

triggers:
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: initial_press
    subtype: 1
    id: on_pressed
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: short_release
    subtype: 2
    id: up_pressed
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: repeat
    subtype: 2
    id: up_tick
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: short_release
    subtype: 3
    id: down_pressed
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: repeat
    subtype: 3
    id: down_tick
  - trigger: device
    device_id: !input dimmer_device
    domain: hue
    type: initial_press
    subtype: 4
    id: off_pressed

variables:
  brightness_step_pct: !input brightness_step_pct
  scene_on: !input scene_on
  scene_up: !input scene_up
  scene_down: !input scene_down

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: on_pressed
        sequence:
          - if:
              - condition: template
                value_template: "{{ scene_on != '' }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ scene_on }}"
                data:
                  transition: 1
          - choose: []
            default: !input on_action
      - conditions:
          - condition: trigger
            id: up_pressed
        sequence:
          - if:
              - condition: template
                value_template: "{{ scene_up != '' }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ scene_up }}"
                data:
                  transition: 1
          - choose: []
            default: !input up_action
      - conditions:
          - condition: trigger
            id: down_pressed
        sequence:
          - if:
              - condition: template
                value_template: "{{ scene_down != '' }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ scene_down }}"
                data:
                  transition: 1
          - choose: []
            default: !input down_action
      - conditions:
          - condition: trigger
            id: up_tick
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ brightness_step_pct }}"
              transition: 1
      - conditions:
          - condition: trigger
            id: down_tick
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct }}"
              transition: 1
      - conditions:
          - condition: trigger
            id: off_pressed
        sequence:
          - action: light.turn_off
            target: !input target_light
            data:
              transition: 1
          - choose: []
            default: !input off_action
