blueprint:
  name: Philips Hue Tap Dial Switch (zigbee2mqtt integration)
  description: |
    Philips Hue Tap Dial Switch:
    - 4 buttons (short press buttons 1/2/3/4), each running its own actions
    - brightness control (rotate dial, faster rotation means bigger steps)
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-tap-dial-zigbee2mqtt.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    z2m_device:
      name: Tap Dial Switch
      description: "The Hue Tap Dial Switch paired with Zigbee2MQTT"
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Philips
    target_light:
      name: Dimming Lights
      description: "Lights dimmed by rotating the dial"
      selector:
        target:
          entity:
            - domain: light
    button_1_action:
      name: Button 1 button
      description: "Actions to run when pushing button 1"
      default: []
      selector:
        action: {}
    button_2_action:
      name: Button 2 button
      description: "Actions to run when pushing button 2"
      default: []
      selector:
        action: {}
    button_3_action:
      name: Button 3 button
      description: "Actions to run when pushing button 3"
      default: []
      selector:
        action: {}
    button_4_action:
      name: Button 4 button
      description: "Actions to run when pushing button 4"
      default: []
      selector:
        action: {}
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per dial step when rotating slowly; doubled when rotating at medium speed and quadrupled when rotating fast"
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_1_press_release"
    id: button_1_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_2_press_release"
    id: button_2_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_3_press_release"
    id: button_3_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_4_press_release"
    id: button_4_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_step"
    variables:
      speed_multiplier: 1
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_slow"
    variables:
      speed_multiplier: 2
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_fast"
    variables:
      speed_multiplier: 4
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_step"
    variables:
      speed_multiplier: 1
    id: dial_left
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_slow"
    variables:
      speed_multiplier: 2
    id: dial_left
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_fast"
    variables:
      speed_multiplier: 4
    id: dial_left

variables:
  brightness_step_pct: !input brightness_step_pct
  target_light: !input target_light
  # The dial steps each light separately, so lights a scene set to different
  # brightnesses keep their differences. Stepping a light group instead sets
  # every member to the same brightness, computed from the group's average.
  # Lights that are off are stepped too: turning up switches them on, and
  # dimming one to 0% switches it off.
  dial_lights: >-
    {% set ns = namespace(ids=[]) %}
    {% for key in ['entity_id', 'device_id', 'area_id', 'floor_id', 'label_id'] %}
      {% set value = target_light.get(key, []) %}
      {% for item in ([value] if value is string else value) %}
        {% if key == 'entity_id' %}
          {% set ns.ids = ns.ids + [item] %}
        {% elif key == 'device_id' %}
          {% set ns.ids = ns.ids + device_entities(item) %}
        {% elif key == 'area_id' %}
          {% set ns.ids = ns.ids + area_entities(item) %}
        {% elif key == 'floor_id' %}
          {% for area in floor_areas(item) %}
            {% set ns.ids = ns.ids + area_entities(area) %}
          {% endfor %}
        {% else %}
          {% set ns.ids = ns.ids + label_entities(item) %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {% set lights = expand(ns.ids) | selectattr('domain', 'eq', 'light') | list %}
    {{ lights | map(attribute='entity_id') | unique | list }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_pressed
        sequence: !input button_1_action
      - conditions:
          - condition: trigger
            id: button_2_pressed
        sequence: !input button_2_action
      - conditions:
          - condition: trigger
            id: button_3_pressed
        sequence: !input button_3_action
      - conditions:
          - condition: trigger
            id: button_4_pressed
        sequence: !input button_4_action
      - conditions:
          - condition: trigger
            id: dial_right
        sequence:
          - condition: template
            value_template: "{{ dial_lights | count > 0 }}"
          - action: light.turn_on
            target:
              entity_id: "{{ dial_lights }}"
            data:
              brightness_step_pct: "{{ brightness_step_pct * speed_multiplier }}"
              transition: 0.2
          # Wait for the fade to finish and the light's final brightness to reach
          # Home Assistant, so the next queued step builds on it instead of on a
          # stale or mid-fade value.
          - delay:
              milliseconds: 300
      - conditions:
          - condition: trigger
            id: dial_left
        sequence:
          - condition: template
            value_template: "{{ dial_lights | count > 0 }}"
          - action: light.turn_on
            target:
              entity_id: "{{ dial_lights }}"
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct * speed_multiplier }}"
              transition: 0.2
          # Wait for the fade to finish and the light's final brightness to reach
          # Home Assistant, so the next queued step builds on it instead of on a
          # stale or mid-fade value.
          - delay:
              milliseconds: 300
