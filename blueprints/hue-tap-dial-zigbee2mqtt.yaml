blueprint:
  name: Philips Hue Tap Dial Switch (zigbee2mqtt integration)
  description: |
    Philips Hue Tap Dial Switch:
    - 4 scene buttons (short press buttons 1/2/3/4)
    - brightness control (rotate dial, faster rotation means bigger steps)
  domain: automation
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-tap-dial-zigbee2mqtt.yaml
  input:
    dial_action:
      name: Tap Dial Switch Action Sensor
      description: "The action indicating the button press or dial rotation on the Hue Tap Dial Switch to configure"
      selector:
        entity:
          integration: mqtt
          domain: sensor
          multiple: true
    target_light:
      name: Target Lights
      description: "Target lights used for brightness control"
      selector:
        target:
          entity:
            - domain: light
    scene_1:
      name: Button 1
      description: "Scene to set when pushing button 1"
      selector:
        target:
          entity:
            - domain: scene
    scene_2:
      name: Button 2
      description: "Scene to set when pushing button 2"
      selector:
        target:
          entity:
            - domain: scene
    scene_3:
      name: Button 3
      description: "Scene to set when pushing button 3"
      selector:
        target:
          entity:
            - domain: scene
    scene_4:
      name: Button 4
      description: "Scene to set when pushing button 4"
      selector:
        target:
          entity:
            - domain: scene
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per dial step when rotating slowly; doubled when rotating at medium speed and quadrupled when rotating fast"
      default: 5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 10

trigger:
  - platform: state
    entity_id: !input dial_action
    to: "button_1_press_release"
    id: button_1_pressed
  - platform: state
    entity_id: !input dial_action
    to: "button_2_press_release"
    id: button_2_pressed
  - platform: state
    entity_id: !input dial_action
    to: "button_3_press_release"
    id: button_3_pressed
  - platform: state
    entity_id: !input dial_action
    to: "button_4_press_release"
    id: button_4_pressed
  - platform: state
    entity_id: !input dial_action
    to:
      - "dial_rotate_right_step"
      - "dial_rotate_right_slow"
      - "dial_rotate_right_fast"
    id: dial_right
  - platform: state
    entity_id: !input dial_action
    to:
      - "dial_rotate_left_step"
      - "dial_rotate_left_slow"
      - "dial_rotate_left_fast"
    id: dial_left

condition: []

variables:
  brightness_step_pct: !input brightness_step_pct
  speed_multiplier: >-
    {% set action = trigger.to_state.state if trigger.to_state is defined else '' %}
    {{ 4 if action.endswith('_fast') else 2 if action.endswith('_slow') else 1 }}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_pressed
        sequence:
          - service: scene.turn_on
            target: !input scene_1
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_2_pressed
        sequence:
          - service: scene.turn_on
            target: !input scene_2
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_3_pressed
        sequence:
          - service: scene.turn_on
            target: !input scene_3
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_4_pressed
        sequence:
          - service: scene.turn_on
            target: !input scene_4
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: dial_right
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ brightness_step_pct * speed_multiplier }}"
              transition: 0.2
      - conditions:
          - condition: trigger
            id: dial_left
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct * speed_multiplier }}"
              transition: 0.2
    default:
      - service: persistent_notification.create
        data:
          message:
            Hue Tap Dial Switch ran default event from "choose" action on button press!
          notification_id: hue_tap_dial_switch_blueprint
          title: Uncaught Tap Dial Command
