blueprint:
  name: Philips Hue Tap Dial Switch (zigbee2mqtt integration)
  description: |
    Philips Hue Tap Dial Switch:
    - 4 scene buttons (short press buttons 1/2/3/4)
    - brightness control (rotate dial, faster rotation means bigger steps)
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-tap-dial-zigbee2mqtt.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    z2m_device:
      name: Tap Dial Switch
      description: "The Hue Tap Dial Switch paired with Zigbee2MQTT"
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Philips
    target_light:
      name: Target Lights
      description: "Target lights used for brightness control"
      selector:
        target:
          entity:
            - domain: light
    scene_1:
      name: Button 1
      description: "Scene to set when pushing button 1"
      selector:
        entity:
          filter:
            - domain: scene
    scene_2:
      name: Button 2
      description: "Scene to set when pushing button 2"
      selector:
        entity:
          filter:
            - domain: scene
    scene_3:
      name: Button 3
      description: "Scene to set when pushing button 3"
      selector:
        entity:
          filter:
            - domain: scene
    scene_4:
      name: Button 4
      description: "Scene to set when pushing button 4"
      selector:
        entity:
          filter:
            - domain: scene
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per dial step when rotating slowly; doubled when rotating at medium speed and quadrupled when rotating fast"
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_1_press_release"
    id: button_1_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_2_press_release"
    id: button_2_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_3_press_release"
    id: button_3_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "button_4_press_release"
    id: button_4_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_step"
    variables:
      speed_multiplier: 1
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_slow"
    variables:
      speed_multiplier: 2
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_right_fast"
    variables:
      speed_multiplier: 4
    id: dial_right
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_step"
    variables:
      speed_multiplier: 1
    id: dial_left
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_slow"
    variables:
      speed_multiplier: 2
    id: dial_left
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "dial_rotate_left_fast"
    variables:
      speed_multiplier: 4
    id: dial_left

variables:
  brightness_step_pct: !input brightness_step_pct

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_1
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_2_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_2
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_3_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_3
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_4_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_4
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: dial_right
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ brightness_step_pct * speed_multiplier }}"
              transition: 0.2
          # Wait for the fade to finish and the light's final brightness to reach
          # Home Assistant, so the next queued step builds on it instead of on a
          # stale or mid-fade value.
          - delay:
              milliseconds: 300
      - conditions:
          - condition: trigger
            id: dial_left
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct * speed_multiplier }}"
              transition: 0.2
          # Wait for the fade to finish and the light's final brightness to reach
          # Home Assistant, so the next queued step builds on it instead of on a
          # stale or mid-fade value.
          - delay:
              milliseconds: 300
