blueprint:
  name: Philips Hue Tap Dial Switch (zigbee2mqtt integration)
  description: |
    Philips Hue Tap Dial Switch:
    - 4 scene buttons (short press buttons 1/2/3/4)
    - brightness control (rotate dial, faster rotation means bigger steps)
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-tap-dial-zigbee2mqtt.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    z2m_device_name:
      name: Tap Dial Switch Name
      description: "The friendly name of the Hue Tap Dial Switch in Zigbee2MQTT"
      selector:
        text:
    z2m_base_topic:
      name: Zigbee2MQTT Base Topic
      description: "The MQTT base topic of Zigbee2MQTT"
      default: zigbee2mqtt
      selector:
        text:
    target_light:
      name: Target Lights
      description: "Target lights used for brightness control"
      selector:
        target:
          entity:
            - domain: light
    scene_1:
      name: Button 1
      description: "Scene to set when pushing button 1"
      selector:
        entity:
          filter:
            - domain: scene
    scene_2:
      name: Button 2
      description: "Scene to set when pushing button 2"
      selector:
        entity:
          filter:
            - domain: scene
    scene_3:
      name: Button 3
      description: "Scene to set when pushing button 3"
      selector:
        entity:
          filter:
            - domain: scene
    scene_4:
      name: Button 4
      description: "Scene to set when pushing button 4"
      selector:
        entity:
          filter:
            - domain: scene
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per dial step when rotating slowly; doubled when rotating at medium speed and quadrupled when rotating fast"
      default: 5
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  z2m_base_topic: !input z2m_base_topic
  z2m_device_name: !input z2m_device_name

triggers:
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "button_1_press_release"
    id: button_1_pressed
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "button_2_press_release"
    id: button_2_pressed
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "button_3_press_release"
    id: button_3_pressed
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "button_4_press_release"
    id: button_4_pressed
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_right_step"
    id: dial_right
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_right_slow"
    id: dial_right
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_right_fast"
    id: dial_right
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_left_step"
    id: dial_left
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_left_slow"
    id: dial_left
  - trigger: mqtt
    topic: "{{ z2m_base_topic }}/{{ z2m_device_name }}/action"
    payload: "dial_rotate_left_fast"
    id: dial_left

variables:
  brightness_step_pct: !input brightness_step_pct
  speed_multiplier: >-
    {% set action = trigger.payload if trigger.payload is defined else '' %}
    {{ 4 if action.endswith('_fast') else 2 if action.endswith('_slow') else 1 }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_1
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_2_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_2
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_3_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_3
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: button_4_pressed
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input scene_4
            data:
              transition: 1
      - conditions:
          - condition: trigger
            id: dial_right
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ brightness_step_pct * speed_multiplier }}"
              transition: 0.2
      - conditions:
          - condition: trigger
            id: dial_left
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct * speed_multiplier }}"
              transition: 0.2
