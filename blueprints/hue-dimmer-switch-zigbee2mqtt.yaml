blueprint:
  name: Philips Hue Dimmer Switch (zigbee2mqtt integration)
  description: |
    Philips Hue Dimmer Switch:
    - 4 buttons (short press on/up/down/off), each running its own actions
    - brightness control of the dimming lights (hold up/down)
  domain: automation
  author: Bart Schuurmans
  source_url: https://github.com/BartSchuurmans/home-assistant-config/blob/main/blueprints/hue-dimmer-switch-zigbee2mqtt.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    z2m_device:
      name: Dimmer Switch
      description: "The Hue Dimmer Switch paired with Zigbee2MQTT"
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Philips
    target_light:
      name: Dimming Lights
      description: "Lights dimmed by holding the Up and Down buttons"
      selector:
        target:
          entity:
            - domain: light
    on_action:
      name: On button
      description: "Actions to run when pushing the On button"
      default: []
      selector:
        action: {}
    up_action:
      name: Up button
      description: "Actions to run when pushing the Up button"
      default: []
      selector:
        action: {}
    down_action:
      name: Down button
      description: "Actions to run when pushing the Down button"
      default: []
      selector:
        action: {}
    off_action:
      name: Off button
      description: "Actions to run when pushing the Off button"
      default: []
      selector:
        action: {}
    brightness_step_pct:
      name: Brightness step size
      description: "Percentage of brightness to change per tick (~ second)"
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

mode: parallel

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "on_press_release"
    id: on_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "up_press_release"
    id: up_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "up_hold"
    id: up_tick
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "down_press_release"
    id: down_pressed
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "down_hold"
    id: down_tick
  - trigger: device
    domain: mqtt
    device_id: !input z2m_device
    type: action
    subtype: "off_press_release"
    id: off_pressed

variables:
  brightness_step_pct: !input brightness_step_pct

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: on_pressed
        sequence: !input on_action
      - conditions:
          - condition: trigger
            id: up_pressed
        sequence: !input up_action
      - conditions:
          - condition: trigger
            id: down_pressed
        sequence: !input down_action
      - conditions:
          - condition: trigger
            id: up_tick
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ brightness_step_pct }}"
              transition: 1
      - conditions:
          - condition: trigger
            id: down_tick
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_pct }}"
              transition: 1
      - conditions:
          - condition: trigger
            id: off_pressed
        sequence: !input off_action
